services:
  api:
    build: ./api
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app

  database:
    image: postgres:15-alpine
    container_name: postgres_server
    restart: unless-stopped
    environment:
      POSTGRES_DB: personal_sys
      POSTGRES_USER: personal_sys_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432" # Left Port changed to 5433 to prevent port conflicts between other server
    volumes:
      - ./database:/var/lib/postgresql/data